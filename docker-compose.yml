version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: apex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apex}
      POSTGRES_USER: ${POSTGRES_USER:-apex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex_user} -d ${POSTGRES_DB:-apex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Logic Engine ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apex_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-apex}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── WordPress (Headless CMS) ────────────────────────────────────────────────
  wordpress:
    image: wordpress:6.5-php8.2-fpm-alpine
    container_name: apex_wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-apex_wp}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-changeme}
      WORDPRESS_TABLE_PREFIX: apex_
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-false}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/apex-core:/var/www/html/wp-content/plugins/apex-core
      - ./wordpress/themes/apex-headless:/var/www/html/wp-content/themes/apex-headless
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: apex_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-apex_wp}
      MYSQL_USER: ${WP_DB_USER:-wp_user}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx-wp:
    image: nginx:alpine
    container_name: apex_nginx_wp
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./nginx/wp.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - wordpress

  # ── Next.js Public Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WP_URL: ${NEXT_PUBLIC_WP_URL:-http://localhost:8080}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── React Admin Dashboard ───────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: apex_admin
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      VITE_WP_URL: ${NEXT_PUBLIC_WP_URL:-http://localhost:8080}
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  wp_data:
  mysql_data:
